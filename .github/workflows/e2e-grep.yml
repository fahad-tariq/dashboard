name: e2e (filtered)

# Re-runs only the Playwright tests whose titles match a pattern, on an
# already pushed ref: gh workflow run e2e-grep.yml -f grep="document style"
on:
  workflow_dispatch:
    inputs:
      grep:
        description: Playwright --grep pattern (test or describe titles)
        required: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: bash e2e/run.sh --grep "$GREP"
        env:
          CI: "true"
          GREP: ${{ inputs.grep }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
