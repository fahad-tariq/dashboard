version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ["*"]
    ignore:
      # Types track the Node major CI runs (24).
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
