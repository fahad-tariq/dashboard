version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # mcp 2.x renamed FastMCP; the migration belongs to Plan 3.
      # update-types alone did not stop a grouped update widening "<2" (PR #9).
      - dependency-name: mcp
        versions: [">=2"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ["*"]
    ignore:
      # Types track the Node major CI runs (24).
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /mcp
    schedule:
      interval: weekly
